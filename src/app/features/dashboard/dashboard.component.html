<!-- Sección de Modelos Oxide Destacados -->
@if (oxideModels().length > 0) {
  <div class="col-span-1 md:col-span-2 lg:col-span-3 mb-8 p-6 bg-amber-50 border-2 border-amber-400 rounded-xl shadow-sm">
    <h2 class="text-2xl font-bold text-amber-800 mb-4 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
      Modelos Oxide Destacados
    </h2>
    <p class="text-amber-700 mb-6">Descubre nuestra tecnología SSM experimental de vanguardia.</p>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (model of oxideModels(); track model.id) {
        <app-model-card [model]="model" />
      }
    </div>
  </div>
}

<!-- Sección de Modelos Generales -->
@if (otherModels().length > 0) {
  <div class="col-span-full">
    <h2 class="text-xl font-semibold text-gray-200 mb-4">Todos los Modelos Disponibles</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (model of otherModels(); track model.id) {
        <app-model-card [model]="model" />
      }
    </div>
  </div>
}
